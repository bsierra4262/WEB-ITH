; php.ini local para el WordPress de desarrollo de Intellihelp (solo 127.0.0.1)
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
file_uploads = On
allow_url_fopen = On
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
default_charset = "UTF-8"
date.timezone = "America/Argentina/Buenos_Aires"

extension_dir = "${LOCALAPPDATA}/Microsoft/WinGet/Packages/PHP.PHP.8.2_Microsoft.Winget.Source_8wekyb3d8bbwe/ext"
extension=mysqli
extension=pdo_mysql
extension=curl
extension=openssl
extension=mbstring
extension=gd
extension=fileinfo
extension=intl
extension=zip
extension=exif
extension=sodium

[curl]
curl.cainfo = "C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"

[openssl]
openssl.cafile = "C:/Program Files/Git/mingw64/etc/ssl/certs/ca-bundle.crt"

[mail function]
; Receptor SMTP local (TEMPLATE-NICO/dev/smtp-local.mjs) en el puerto 2525
SMTP = 127.0.0.1
smtp_port = 2525
sendmail_from = wordpress@intellihelp.local
mail.add_x_header = Off
